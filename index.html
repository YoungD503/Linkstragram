<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoungDesertZone</title>
<meta name="description" content="Everything from YoungDesertZone, in one place.">
<meta property="og:title" content="YoungDesertZone">
<meta property="og:description" content="Everything from YoungDesertZone, in one place.">
<meta name="theme-color" content="#050607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#050607;--surface:#0c0f10;--surface-2:#121718;--line:#1f2628;--line-strong:#2c3538;
  --fg:#f2f5f4;--muted:#8e989a;--green:#34d77b;--blue:#3b9dff;--gray:#5b666b;--on-accent:#03140a;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;position:relative}
img{max-width:100%}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 18%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 55% at 50% 18%,#000 0%,transparent 75%);opacity:.7}
.bg-glow{position:fixed;left:50%;top:-180px;width:720px;max-width:160vw;height:460px;transform:translateX(-50%);z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(52,215,123,.3),transparent),radial-gradient(closest-side at 70% 60%,rgba(59,157,255,.32),transparent);filter:blur(40px);opacity:.75}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(12,15,16,.8);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--green),var(--blue));color:var(--on-accent);font:800 12px var(--sans)}
.logo img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--mono);color:var(--muted);flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,215,123,.25);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(52,215,123,0)}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.avatar{width:88px;height:88px;border-radius:24px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 10px 40px -10px rgba(59,157,255,.6)}
.avatar span{font:800 26px var(--sans);color:var(--on-accent)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;text-decoration:none;transition:border-color .2s}
.badge b{color:var(--fg);font-weight:500}
.badge .tag{font:500 11px var(--mono);color:var(--on-accent);background:var(--green);padding:2px 8px;border-radius:999px}
.badge:hover{border-color:var(--green)}
h1{margin:0;font-weight:800;font-size:clamp(34px,10vw,54px);line-height:1;letter-spacing:-.045em;text-wrap:balance;word-break:break-word;
  background:linear-gradient(180deg,var(--fg) 30%,#8a9396);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:17px;max-width:34ch;text-wrap:balance}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--sans);text-decoration:none;padding:13px 22px;border-radius:12px;transition:transform .15s ease,box-shadow .2s ease,border-color .2s}
.cta.primary{background:var(--green);color:var(--on-accent);box-shadow:0 8px 30px -8px rgba(52,215,123,.7)}
.cta.primary:hover{transform:translateY(-1px);box-shadow:0 12px 40px -8px rgba(52,215,123,.85)}
.cta.secondary{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong)}
.cta.secondary:hover{border-color:var(--blue)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);padding:14px 16px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;transition:border-color .2s,transform .15s ease}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.card:hover .go{color:var(--fg);transform:translateX(2px)}
.icon{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--bg)}
.icon svg{width:18px;height:18px}
.cards li:nth-child(odd) .icon{color:var(--green)}
.cards li:nth-child(even) .icon{color:var(--blue)}
.card-text{display:flex;flex-direction:column;min-width:0;flex:1}
.card-title{font-weight:600;font-size:15px}
.card-url{font:400 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{color:var(--gray);flex:none;transition:transform .15s ease,color .2s;font-size:18px}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line);font:400 12px var(--mono);color:var(--gray)}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.card,.cta,.go{transition:none}.card:hover,.cta.primary:hover{transform:none}}
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

          <span class="card-text"><span class="card-title">TDZone</span><span class="card-url"></span></span>

        <a class="card" href="https://youngd503.github.io/library/" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>

</div>
</body>
</html>
